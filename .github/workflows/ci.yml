name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '22.12.0'
          - '24'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate static documentation
        run: npm run test:site

  coverage:
    name: vanilla-test coverage / Node 24.18.0
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run coverage gate
        run: npm run coverage

      - name: Verify measured coverage badges are current
        run: git diff --exit-code -- badges

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vanilla-test-node-coverage
          path: coverage/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  package-smoke:
    name: Packed npm artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test packed package
        run: npm run test:package

      - name: Pack npm artifact
        run: npm pack --silent

      - name: Upload packed npm artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-http-server-v9-package
          path: node-http-server-*.tgz
          if-no-files-found: error
          retention-days: 14

  benchmark:
    name: HTTP + core benchmarks / Node 24.18.0
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'

      - name: Run validated HTTP benchmarks
        shell: bash
        run: |
          set -o pipefail
          node ./benchmark/run.js --json | tee benchmark-results.json

      - name: Compare release core paths
        run: |
          node --expose-gc ./benchmark/core.js --output site/benchmarks/core-ci.json
          cp site/benchmarks/core-ci.json core-benchmark-results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: node-http-server-benchmark
          path: |
            benchmark-results.json
            core-benchmark-results.json
          if-no-files-found: error
          retention-days: 14

  pages:
    name: Assemble GitHub Pages site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs:
      - test
      - coverage
      - package-smoke
      - benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate static documentation
        run: npm run test:site

      - name: Download canonical coverage report
        uses: actions/download-artifact@v8
        with:
          name: vanilla-test-node-coverage
          path: _coverage

      - name: Download benchmark results
        uses: actions/download-artifact@v8
        with:
          name: node-http-server-benchmark
          path: _benchmark

      - name: Assemble static site
        shell: bash
        run: |
          mkdir -p _site
          cp --recursive site/. _site/
          mkdir -p _site/assets
          cp assets/node-http-server-header-https.webp _site/assets/
          mkdir -p _site/coverage
          cp --recursive _coverage/node _site/coverage/node
          cp --recursive _coverage/badges _site/badges
          mkdir -p _site/benchmarks
          cp _benchmark/benchmark-results.json _site/benchmarks/latest.json
          cp _benchmark/core-benchmark-results.json _site/benchmarks/core-latest.json
          touch _site/.nojekyll

          test -f _site/index.html
          test -f _site/guide.html
          test -f _site/why.html
          test -f _site/cli.html
          test -f _site/api.html
          test -f _site/configuration.html
          test -f _site/https.html
          test -f _site/examples.html
          test -f _site/playground.html
          test -f _site/testing.html
          test -f _site/performance.html
          test -f _site/benchmarks.html
          test -f _site/operations.html
          test -f _site/resources.html
          test -f _site/styles.css
          test -f _site/script.js
          test -f _site/playground.js
          test -f _site/assets/node-http-server-header-https.webp
          test -f _site/coverage/node/index.html
          test -f _site/badges/lines.json
          test -f _site/badges/functions.json
          test -f _site/badges/branches.json
          test -f _site/benchmarks/latest.json
          test -f _site/benchmarks/core-latest.json
          test -f _site/benchmarks/core-9.0.2-vs-9.1.0.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5




