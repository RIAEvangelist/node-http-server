name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '22.12.0'
          - '24'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  coverage:
    name: Node-native V8 coverage / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run coverage gate
        run: npm run coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-native-v8-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  package-smoke:
    name: Packed npm artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test packed package
        run: npm run test:package

      - name: Pack npm artifact
        run: npm pack --silent

      - name: Upload packed npm artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-http-server-v9-package
          path: node-http-server-*.tgz
          if-no-files-found: error
          retention-days: 14

  pages:
    name: Assemble GitHub Pages site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs:
      - test
      - coverage
      - package-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate site JavaScript
        run: node --check site/script.js

      - name: Assemble static site
        shell: bash
        run: |
          mkdir -p _site
          cp --recursive site/. _site/
          mkdir -p _site/assets
          cp assets/node-http-server-header.webp _site/assets/
          touch _site/.nojekyll

          test -f _site/index.html
          test -f _site/styles.css
          test -f _site/script.js
          test -f _site/assets/node-http-server-header.webp

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

